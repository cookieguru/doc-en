# https://docs.github.com/en/actions

name: "Example Versions"

on:
  workflow_dispatch:
    inputs:
      open_issues:
        description: "Open or update GitHub issues for failing pages"
        type: "boolean"
        default: false
      only:
        description: "Comma-separated extension or page filter (empty for everything)"
        type: "string"
        default: ""
      fixtures_only:
        description: "Use the bundled fixtures instead of building the manual"
        type: "boolean"
        default: false

permissions:
  contents: "read"

jobs:
  extract:
    name: "Extract examples"
    if: "github.repository == 'cookieguru/doc-en'"
    runs-on: "ubuntu-latest"

    outputs:
      tags: "${{ steps.tags.outputs.tags }}"

    steps:
      - name: "Checkout cookieguru/doc-en"
        uses: "actions/checkout@v7.0.1"
        with:
          path: "en"

      - name: "Checkout php/doc-base"
        if: "${{ !inputs.fixtures_only }}"
        uses: "actions/checkout@v7.0.1"
        with:
          path: "doc-base"
          repository: "php/doc-base"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@2.40.0"
        with:
          php-version: "8.5"
          extensions: "dom, libxml, simplexml, xmlreader, mbstring"
        env:
          fail-fast: true

      - name: "Build documentation"
        if: "${{ !inputs.fixtures_only }}"
        run: |
          php doc-base/configure.php \
            --disable-libxml-check \
            --enable-xml-details \
            --redirect-stderr-to-stdout \
            --with-lang=en

      - name: "Extract examples"
        env:
          ONLY: "${{ inputs.only }}"
        run: |
          if [ "${{ inputs.fixtures_only }}" = "true" ]; then
            manual=en/.github/example-versions/fixtures/manual.xml
            reference=en/.github/example-versions/fixtures/reference
          else
            manual=doc-base/.manual.xml
            reference=en/reference
          fi
          php en/.github/example-versions/extract.php \
            --manual="$manual" \
            --reference="$reference" \
            --out=out \
            --only="$ONLY"

      - name: "Upload batches"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "batches"
          path: "out/"

      - name: "Publish tags"
        id: "tags"
        run: echo "tags=$(jq -c . out/tags.json)" >> "$GITHUB_OUTPUT"

  run:
    name: "Run on PHP ${{ matrix.tag }}"
    if: "github.repository == 'cookieguru/doc-en' && needs.extract.outputs.tags != '[]'"
    needs: "extract"
    runs-on: "ubuntu-latest"
    timeout-minutes: 120

    env:
      FALLBACK_TAG: "5.5.38"

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tag: "${{ fromJSON(needs.extract.outputs.tags) }}"

    steps:
      - name: "Checkout cookieguru/doc-en"
        uses: "actions/checkout@v7.0.1"
        with:
          path: "en"

      - name: "Download batches"
        uses: "actions/download-artifact@v8.0.2"
        with:
          name: "batches"
          path: "batches"

      - name: "Prepare results directory"
        run: |
          mkdir results
          chmod 777 results

      - name: "Pull php:${{ matrix.tag }}-cli"
        id: "pull"
        run: |
          if docker pull php:${{ matrix.tag }}-cli \
            || skopeo copy --format v2s2 \
              docker://docker.io/library/php:${{ matrix.tag }}-cli \
              docker-daemon:php:${{ matrix.tag }}-cli; then
            echo ok=1 >> "$GITHUB_OUTPUT"
          fi

      - name: "Build image with extensions"
        if: "steps.pull.outputs.ok == '1'"
        run: |
          en/.github/example-versions/build-image.sh php:${{ matrix.tag }}-cli ev-image \
            $(jq -r '.extensions[]' batches/batch-${{ matrix.tag }}.json)

      - name: "Run examples"
        if: "steps.pull.outputs.ok == '1'"
        run: |
          docker run --rm --network none \
            -v "$PWD/en/.github/example-versions:/ev:ro" \
            -v "$PWD/batches:/batches:ro" \
            -v "$PWD/results:/results" \
            ev-image php /ev/runner.php run \
            /batches/batch-${{ matrix.tag }}.json \
            /results/results-${{ matrix.tag }}.json

      # The extension installer needs PHP 5.5+, so examples skipped for a
      # missing extension on 5.3/5.4 rerun on the last 5.5 release instead.
      - name: "Rerun skipped examples on PHP ${{ env.FALLBACK_TAG }}"
        if: "steps.pull.outputs.ok == '1' && (startsWith(matrix.tag, '5.3.') || startsWith(matrix.tag, '5.4.'))"
        run: |
          results=results/results-${{ matrix.tag }}.json
          extensions=$(jq -r '[.results[] | select(.status == "skipped-extension") | .extension] | unique | .[]' "$results")
          if [ -z "$extensions" ]; then
            exit 0
          fi
          docker pull php:${FALLBACK_TAG}-cli
          en/.github/example-versions/build-image.sh php:${FALLBACK_TAG}-cli ev-fallback $extensions
          docker run --rm --network none \
            -v "$PWD/en/.github/example-versions:/ev:ro" \
            -v "$PWD/batches:/batches:ro" \
            -v "$PWD/results:/results" \
            ev-fallback php /ev/runner.php rerun-skipped \
            /batches/batch-${{ matrix.tag }}.json \
            /results/results-${{ matrix.tag }}.json \
            "$FALLBACK_TAG"

      - name: "Check results exist"
        id: "results"
        if: "${{ !cancelled() }}"
        run: |
          if [ ! -f results/results-${{ matrix.tag }}.json ]; then echo missing=1 >> "$GITHUB_OUTPUT"; fi

      - name: "Setup PHP"
        if: "${{ !cancelled() && steps.results.outputs.missing == '1' }}"
        uses: "shivammathur/setup-php@2.40.0"
        with:
          php-version: "8.5"
        env:
          fail-fast: true

      - name: "Mark image unavailable"
        if: "${{ !cancelled() && steps.results.outputs.missing == '1' }}"
        run: |
          php en/.github/example-versions/runner.php unavailable \
            batches/batch-${{ matrix.tag }}.json \
            results/results-${{ matrix.tag }}.json

      - name: "Upload results"
        if: "${{ !cancelled() }}"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "results-${{ matrix.tag }}"
          path: "results/"

  report:
    name: "Report"
    if: "${{ !cancelled() && needs.extract.result == 'success' && github.repository == 'cookieguru/doc-en' }}"
    needs:
      - "extract"
      - "run"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      issues: "write"

    steps:
      - name: "Checkout cookieguru/doc-en"
        uses: "actions/checkout@v7.0.1"
        with:
          path: "en"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@2.40.0"
        with:
          php-version: "8.5"
        env:
          fail-fast: true

      - name: "Download results"
        uses: "actions/download-artifact@v8.0.2"
        with:
          pattern: "results-*"
          merge-multiple: false
          path: "all"

      - name: "Download batches for unresolved examples"
        uses: "actions/download-artifact@v8.0.2"
        with:
          name: "batches"
          path: "all/batches"

      - name: "Render report"
        run: php en/.github/example-versions/report.php all report

      - name: "Upload report"
        uses: "actions/upload-artifact@v7.0.2"
        with:
          name: "report"
          path: "report/"

      - name: "Sync issues"
        if: "${{ inputs.open_issues }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: php en/.github/example-versions/sync-issues.php all ${{ github.repository }}
